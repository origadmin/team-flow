# .team/config.yaml — Project Structured Configuration
# Generated by: flow init
# Resolved by: flow config paths --json

version: 1

project:
  name: {project-name}
  type: web-application  # web-application / library / framework / tool

paths:
  # _ prefix = relative to workspace root
  # other = relative to project root
  # Not written = this project does not need this path

  docs_internal: _docs/{project-name}/
  # docs_external: docs/

  # AI temporary files directory
  # Not written = default: {project}/.team/tmp/
  # tmp_dir: .team/tmp/

tools:
  beads:
    required: true
    # v2: uses default configuration (from default-tools.yaml)
    # v3: can override command mapping

# v3 extension placeholders
